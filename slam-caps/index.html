<h2>How to play SLAM CAPS</h2>
<ol class="rules">
  <li><b>Build the stack.</b> You and your rival each put 3 caps in a stack of 6. Yours start at the bottom of the table.</li>
  <li><b>Pick a move in secret:</b> Power, Spin or Precision.</li>
  <li><b>Slam.</b> Hold SLAM (or the table) and let go. Holding only changes how loud the hit sounds; the hit itself comes from a fair random draw, never from timing.</li>
  <li><b>Take caps.</b> On each slam, every cap still in the stack gets a hit from each of you. Clear the line and you take it; if you both clear it, the harder hit wins. Caps nobody takes stay for the next slam.</li>
  <li><b>Three slams.</b> The line is high on slam 1 and lower after. Slam 3 is a showdown: every cap left goes to the harder hit (an exact tie sends it home).</li>
  <li><b>Keep what you win.</b> Every cap you take is yours, your own included. Take more than you put in and you're up.</li>
</ol>
<h3>The moves</h3>
<dl class="rules">
  <dt>Power</dt><dd>Wild. The biggest hits and the worst misses, and the move most likely to land a perfect slam.</dd>
  <dt>Spin</dt><dd>Rides the curl. A bonus on curled caps, a penalty on flat ones. Each cap shows its curl (0 to 3).</dd>
  <dt>Precision</dt><dd>Steady. Rarely great, rarely bad.</dd>
</dl>
<p class="note">No move beats another overall. The numbers were tuned over millions of simulated matches so every move has the same odds; the difference is how it feels.</p>
<h3>Ways to play</h3>
<dl class="rules">
  <dt>Practice</dt><dd>Free against the bot. No wallet, nothing changes hands.</dd>
  <dt>Daily stack</dt><dd>Same stack and rival for everyone today. Compare with friends.</dd>
  <dt>Pass &amp; play</dt><dd>Two people, one phone. Each picks a move in secret.</dd>
  <dt>Challenge a friend</dt><dd>Send a link. They answer your move on the same stack.</dd>
  <dt>For keeps</dt><dd>Bet 3 of your caps (NFTs on Base Sepolia, test caps with no value) against another player's 3. Sign in with email, get free starter caps, and every slam is settled on-chain with Chainlink randomness that nobody, including us, can see or change in advance. The player who opens a match shows their move; it barely matters, since no move beats another.</dd>
