<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEADS</title>
<style>
html,body{margin:0;background:#0e0d14;color:#efeaf6;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
main{max-width:560px;margin:0 auto;padding:40px 16px;display:grid;gap:12px}
.bad{color:#ff8a7a}
code{word-break:break-all;color:#9a93ab}
</style>
</head>
<body>
<main>
<div id="msg">Loading HEADS from the blockchain…</div>
<code>Base Sepolia · page contract 0x377c3ca389094ded207ba3c39cf19182de4788d7</code>
</main>
<script>
(()=>{ // own scope: document.write keeps the global scope, and the page declares the same helpers
// keccak-256 (BigInt lanes) + a small, bounds-checked ABI encoder/decoder. No dependencies.
const K_RC=[1n,0x8082n,0x800000000000808an,0x8000000080008000n,0x808bn,0x80000001n,0x8000000080008081n,0x8000000000008009n,0x8an,0x88n,0x80008009n,0x8000000an,0x8000808bn,0x800000000000008bn,0x8000000000008089n,0x8000000000008003n,0x8000000000008002n,0x8000000000000080n,0x800an,0x800000008000000an,0x8000000080008081n,0x8000000000008080n,0x80000001n,0x8000000080008008n];
const K_ROT=[[0,36,3,41,18],[1,44,10,45,2],[62,6,43,15,61],[28,55,25,21,56],[27,20,39,8,14]];
const K_M=(1n<<64n)-1n;
function kRotl(v,n){if(!n)return v;const b=BigInt(n);return((v<<b)|(v>>(64n-b)))&K_M;}
function kF(A){for(let r=0;r<24;r++){const C=[];for(let x=0;x<5;x++)C[x]=A[x]^A[x+5]^A[x+10]^A[x+15]^A[x+20];
for(let x=0;x<5;x++){const D=C[(x+4)%5]^kRotl(C[(x+1)%5],1);for(let y=0;y<5;y++)A[x+5*y]^=D;}
const B=new Array(25);for(let x=0;x<5;x++)for(let y=0;y<5;y++)B[y+5*((2*x+3*y)%5)]=kRotl(A[x+5*y],K_ROT[x][y]);
for(let x=0;x<5;x++)for(let y=0;y<5;y++)A[x+5*y]=B[x+5*y]^((~B[(x+1)%5+5*y])&K_M&B[(x+2)%5+5*y]);A[0]^=K_RC[r];}}
function keccak(bytes){const rate=136,A=new Array(25).fill(0n);const p=new Uint8Array(Math.floor(bytes.length/rate+1)*rate);p.set(bytes);p[bytes.length]^=1;p[p.length-1]^=0x80;
for(let o=0;o<p.length;o+=rate){for(let i=0;i<17;i++){let v=0n;for(let b=7;b>=0;b--)v=(v<<8n)|BigInt(p[o+i*8+b]);A[i]^=v;}kF(A);}
const out=new Uint8Array(32);for(let i=0;i<4;i++){let v=A[i];for(let b=0;b<8;b++){out[i*8+b]=Number(v&0xffn);v>>=8n;}}return out;}
const te=new TextEncoder();
function hex(b){return"0x"+[...b].map(x=>x.toString(16).padStart(2,"0")).join("");}
function unhex(h){h=h.replace(/^0x/,"");const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
function cat(...a){const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let k=0;for(const x of a){o.set(x,k);k+=x.length;}return o;}

// ---- ABI. Types: "uint" | "bool" | "address" | "bytes8" | "bytes" | {tup:[...]} | {arr:T}
const ABI_MAX_ARR=64;
function isDyn(t){return t==="bytes"||!!t.arr||!!(t.tup&&t.tup.some(isDyn));}
function hsize(t){return t.tup&&!isDyn(t)?t.tup.reduce((s,x)=>s+hsize(x),0):32;}
function word(v){v=BigInt(v);if(v<0n)v=(1n<<256n)+v;if(v>=(1n<<256n))throw new Error("abi: overflow");const o=new Uint8Array(32);for(let i=31;i>=0;i--){o[i]=Number(v&0xffn);v>>=8n;}return o;}
function abiEnc(types,vals){const heads=[],tails=[];let hs=0;for(const t of types)hs+=isDyn(t)?32:hsize(t);let tl=0;
  types.forEach((t,i)=>{const e=encOne(t,vals[i]);if(isDyn(t)){heads.push(word(hs+tl));tails.push(e);tl+=e.length;}else heads.push(e);});return cat(...heads,...tails);}
function encOne(t,v){
  if(t==="uint")return word(v);if(t==="bool")return word(v?1:0);
  if(t==="address"){if(!/^0x[0-9a-fA-F]{40}$/.test(v))throw new Error("abi: address");return word(BigInt(v));}
  if(t==="bytes8"){const b=v instanceof Uint8Array?v:unhex(v);if(b.length!==8)throw new Error("abi: bytes8");const o=new Uint8Array(32);o.set(b);return o;}
  if(t==="bytes"){const b=v instanceof Uint8Array?v:unhex(v);const pad=new Uint8Array(Math.ceil(b.length/32)*32);pad.set(b);return cat(word(b.length),pad);}
  if(t.tup)return abiEnc(t.tup,v);if(t.arr)return cat(word(v.length),abiEnc(v.map(()=>t.arr),v));throw new Error("abi: type");}
function rdWord(d,o){if(!Number.isSafeInteger(o)||o<0||o+32>d.length)throw new Error("abi: out of range");let v=0n;for(let i=0;i<32;i++)v=(v<<8n)|BigInt(d[o+i]);return v;}
function rdOff(d,o,base){const v=rdWord(d,o);if(v>BigInt(d.length))throw new Error("abi: bad offset");return base+Number(v);}
function abiDec(types,d,base=0){let o=base;return types.map(t=>{const at=o;o+=isDyn(t)?32:hsize(t);return isDyn(t)?decOne(t,d,rdOff(d,at,base)):decOne(t,d,at);});}
function decOne(t,d,o){
  if(t==="uint")return rdWord(d,o);if(t==="bool"){const v=rdWord(d,o);if(v>1n)throw new Error("abi: bool");return v===1n;}
  if(t==="address"){const v=rdWord(d,o);if(v>>160n)throw new Error("abi: address");return"0x"+v.toString(16).padStart(40,"0");}
  if(t==="bytes8"){rdWord(d,o);return d.slice(o,o+8);}
  if(t==="bytes"){const n=rdWord(d,o);if(n>BigInt(d.length))throw new Error("abi: bytes length");const e=o+32+Number(n);if(e>d.length)throw new Error("abi: out of range");return d.slice(o+32,e);}
  if(t.tup)return abiDec(t.tup,d,o);
  if(t.arr){const n=rdWord(d,o);if(n>BigInt(ABI_MAX_ARR))throw new Error("abi: array too long");return abiDec(Array(Number(n)).fill(t.arr),d,o+32);}
  throw new Error("abi: type");}
function sel(sig){return keccak(te.encode(sig)).slice(0,4);}

// Loader: fetch the site stored in the page contract (ERC-8244 html()), check
// its hash against the contract's PAGE_HASH, then render it. This file only
// delivers the loader; every byte of the site comes from the chain.
const L={page:"0x377c3ca389094ded207ba3c39cf19182de4788d7",rpcs:["https://sepolia.base.org","https://base-sepolia-rpc.publicnode.com"],chainId:84532};
const msg=t=>{const m=document.getElementById("msg");m.textContent=t;m.className="bad";};
async function rpc(method,params){let last;for(const u of L.rpcs){try{const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});
  const j=await r.json();if(j.error)throw new Error(j.error.message);return j.result;}catch(e){last=e;}}throw last||new Error("no RPC");}
(async()=>{try{
  if(BigInt(await rpc("eth_chainId",[]))!==BigInt(L.chainId))throw new Error("RPC is on the wrong chain.");
  const [doc]=abiDec(["bytes"],unhex(await rpc("eth_call",[{to:L.page,data:hex(sel("html()"))},"latest"])));
  const want=await rpc("eth_call",[{to:L.page,data:hex(sel("PAGE_HASH()"))},"latest"]);
  if(hex(keccak(doc)).toLowerCase()!==want.toLowerCase())throw new Error("The page didn't match its on-chain hash, so it wasn't shown.");
  const html=new TextDecoder().decode(doc);
  document.open();document.write(html);document.close();
}catch(e){msg("Couldn't load the page from the chain: "+(e&&e.message||e)+" Try again in a moment.");}})();
})();
</script>
</body>
</html>
